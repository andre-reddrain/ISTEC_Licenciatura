<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript Form Practice</title>
    <style>
        body {
            font-family: Arial;
            margin: 30px;
            background: #f2f2f2;
        }

        form {
            background: white;
            padding: 20px;
            max-width: 500px;
            border-radius: 8px;
        }

        .field {
            margin-bottom: 15px;
        }

        label {
            display: inline-block;
            margin-bottom: 5px;
        }

        input:not([type="radio"]):not([type="checkbox"]),
        select,
        textarea {
            padding: 8px;
            width: 95%;
        }

        button {
            padding: 10px 20px;
            cursor: pointer;
        }

        #result {
            margin-top: 20px;
            padding: 15px;
            background: #e0f0ff;
        }
    </style>
</head>

<body>
    <h1>Student Registration</h1>

    <form action="#" method="post" enctype="application/x-www-form-urlencoded" id="studentForm">

        <div class="field">
            <label for="name">Name:</label>
            <input type="text" id="name" value="Neves" name="name" placeholder="Student name" required>
        </div>

        <div class="field">
            <label for="age">Age:</label>
            <input type="number" placeholder="a sua idade" id="age" name="age" min="15" max="99" value="18">
        </div>

        <div class="field">
            <label for="email">Email:</label>
            <input type="email" required id="email" value="boturao@netcabo.pt" name="email">
        </div>

        <div class="field">
            <label for="password">Password:</label>
            <input type="password" value="123" id="password" name="password">
        </div>

        <div class="field">
            <label>Gender:</label><br>

            <input type="radio" checked id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>

            <input type="radio" id="other" name="gender" value="Other">
            <label for="other">Other</label>
        </div>

        <div class="field">
            <label>Programming languages:</label><br>

            <input type="checkbox" id="html" checked name="languages" value="HTML">
            <label for="html">HTML</label>

            <input type="checkbox" id="css" name="languages" value="CSS">
            <label for="css">CSS</label>

            <input type="checkbox" checked id="js" name="languages" value="JavaScript">
            <label for="js">JavaScript</label>

            <input type="checkbox" id="java" name="languages" value="Java">
            <label for="java">Java</label>
        </div>

        <div class="field">
            <label for="course">Course:</label>

            <select id="course" name="course">
                <option value="">Select a course</option>
                <option value="TSI">Computer Systems</option>
                <option value="TGPSI">Programming</option>
                <option value="TGEI" selected>Electronics</option>
            </select>
        </div>

        <div class="field">
            <label for="birthdate">Birth date:</label>
            <input type="date" id="birthdate" value="1963-05-10" name="birthdate">
        </div>

        <div class="field">
            <label for="level">Programming level:</label>
            <input type="range" id="level" name="level" min="0" max="10" value="5">
            <span id="levelValue">5</span>
        </div>

        <div class="field">
            <label for="comments">Comments:</label>
            <textarea id="comments" name="comments" rows="4"></textarea>
        </div>

        <div class="field">
            <input type="checkbox" checked id="terms" name="terms">
            <label for="terms">Accept terms and conditions</label>
        </div>

        <button type="button">Submit</button>
        <button type="reset">Reset</button>

        <table border="1">
            <thead>
                <th>Key</th>
                <th>Valores</th>
            </thead>
            <tbody></tbody>
        </table>

    </form>

    <div id="result"></div>

    <script>
        window.onload = function () {
            const frm = document.getElementById("studentForm");
            formdata = new FormData(frm);
            for (const [k, v] of formdata) console.log(`${k}->${v}`);
            const dados = new URLSearchParams(formdata);

            const linhas = Array.from(dados).map(e => `<tr><td>${e[0]}</td> <td>${e[1]}</td></tr>`);
            document.querySelector('tbody').innerHTML = linhas.join('');

            console.log(linhas);
        }
    </script>
</body>
</html>
